name: Frontend checks and release
on:
  pull_request:
    branches: [v2-branch]
  push:
    branches: [v2-branch]
    tags: ['nanolabs-v2-*']
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref_type == 'tag' && 'prod' || 'dev' }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build matching hosted environment
        run: node scripts/build-hosted.mjs "$TARGET"
        env:
          TARGET: ${{ github.ref_type == 'tag' && 'prod' || 'dev' }}
      - name: Release only commits from v2-branch
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor HEAD origin/v2-branch
      - name: Deploy exact build to Cloudflare
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing nanoLabs-scoped Cloudflare deployment token'; exit 1; }
          if [ "$TARGET" = dev ]; then
            npx --yes wrangler@4.160.0 deploy --config wrangler.jsonc --env dev
          else
            npx --yes wrangler@4.160.0 deploy --config wrangler.jsonc
          fi
        env:
          TARGET: ${{ github.ref_type == 'tag' && 'prod' || 'dev' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify hosted page and API readiness
        if: github.event_name == 'push'
        run: |
          node --input-type=module <<'JS'
          import config from './config/hosting.json' with {type:'json'};
          const selected=config.environments[process.env.TARGET];
          for(const url of [selected.frontend,`${selected.apiUrl}/api/ready`]){
            const response=await fetch(url,{signal:AbortSignal.timeout(30000)});
            if(!response.ok)throw new Error(`Hosted verification failed: ${url} (${response.status})`);
            console.log(`Verified ${url}`);
          }
          JS
        env:
          TARGET: ${{ github.ref_type == 'tag' && 'prod' || 'dev' }}
